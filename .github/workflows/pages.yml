name: Publish Wild Frontier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out game
        uses: actions/checkout@v6
      - name: Verify local game assets
        run: node scripts/check-static.mjs
      - name: Install locked model-check dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify arm posture and grip geometry
        run: npm run check:arms
      - name: Verify cactus, sparse grass and enemy voices
        run: npm run check:field
      - name: Verify drivable terrain, collisions and water
        run: npm run check:driving
      - name: Verify combat voice priority and lifecycle
        run: npm run check:voices
      - name: Verify aiming gestures and intentional pause
        run: npm run check:input
      - name: Verify enemy perception, character motion and core combat
        run: |
          npm run check:ai
          node scripts/check-character-motion.mjs
          node scripts/check-interactive-world.mjs
          npm run check
      - name: Verify physical hit reactions and articulated falls
        run: npm run check:hits
      - name: Verify staged vehicle blast, landing and persistent smoke
        run: npm run check:wrecks
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload full game
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 600000
